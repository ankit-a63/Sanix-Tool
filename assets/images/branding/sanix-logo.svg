<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 100" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7f00ff"/>
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
    
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- LOGO ICON MARK -->
  <g transform="translate(10, 10)">
    <!-- Outer Glowing Hexagon Frame -->
    <polygon points="40,2 75,22 75,62 40,82 5,62 5,22" fill="none" stroke="url(#primary-grad)" stroke-width="3.5" filter="url(#neon-glow)" />
    
    <!-- Inner Cyber S Core Matrix -->
    <path d="M 50 25 L 30 25 C 24 25 24 35 30 35 L 50 45 C 56 45 56 55 50 55 L 30 55" fill="none" stroke="url(#accent-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)"/>
    
    <!-- Tech Accent Nodes -->
    <circle cx="40" cy="14" r="3" fill="#00f2fe" />
    <circle cx="40" cy="68" r="3" fill="#7f00ff" />
    <circle cx="25" cy="40" r="2.5" fill="#00f2fe" />
    <circle cx="55" cy="40" r="2.5" fill="#7f00ff" />
  </g>

  <!-- TYPOGRAPHY: SANIX -->
  <text x="105" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="38" letter-spacing="3" fill="url(#text-grad)">
    SANIX
  </text>
  
  <!-- TYPOGRAPHY: TOOL -->
  <text x="250" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="800" font-size="38" letter-spacing="3" fill="url(#primary-grad)" filter="url(#neon-glow)">
    TOOL
  </text>

  <!-- TAGLINE: ONE PLATFORM. EVERY TOOL. -->
  <text x="107" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="600" font-size="10.5" letter-spacing="3.5" fill="#94a3b8">
    ONE PLATFORM. EVERY TOOL.
  </text>
</svg>
