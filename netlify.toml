# SANIX TOOL - Netlify Build & Pretty Routing Configuration

[build]
  publish = "."

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"

# Main Page Rewrites
[[redirects]]
  from = "/tools"
  to = "/tools.html"
  status = 200
  force = true

