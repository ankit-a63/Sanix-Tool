
<div class="container" style="padding-top: 2rem; padding-bottom: 4rem;">
  <div class="tool-workspace">
    <div class="tool-header">
      <div class="tool-header-info">
        <div class="tool-icon">🧹</div>
        <div>
          <h1 class="tool-header-title">Text Cleaner & Find/Replace</h1>
          <p class="tool-header-desc">Strip extra whitespace, remove HTML tags and perform search & replace.</p>
        </div>
      </div>
      <button class="fav-btn" data-tool="text-cleaner" title="Favorite this tool">🤍</button>
    </div>

    <div class="form-group">
      <textarea id="text-input" class="form-control" style="min-height: 200px;" placeholder="Paste messy or HTML-formatted text here..."></textarea>
    </div>

    <!-- FIND & REPLACE CONTROLS -->
    <div class="tool-controls-grid">
      <div class="form-group">
        <label class="form-label">Find String</label>
        <input type="text" id="find-str" class="form-control" placeholder="Text to find">
      </div>

      <div class="form-group">
        <label class="form-label">Replace With</label>
        <input type="text" id="replace-str" class="form-control" placeholder="Replacement text">
      </div>

      <div class="form-group" style="display:flex; align-items:flex-end;">
        <button class="btn btn-secondary" id="btn-find-replace" style="width:100%;">Replace All</button>
      </div>
    </div>

    <div class="tool-controls-grid" style="grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));">
      <button class="btn btn-secondary" id="btn-strip-spaces">Spaces ➔ Single Space</button>
      <button class="btn btn-secondary" id="btn-strip-html">Strip HTML Tags</button>
      <button class="btn btn-secondary" id="btn-strip-breaks">Remove Line Breaks</button>
    </div>

    <div class="tool-action-bar">
      <button class="btn btn-secondary" id="clear-btn">🗑️ Clear</button>
      <div style="display:flex; gap:0.5rem;">
        <button class="btn btn-secondary" id="copy-btn">📋 Copy Text</button>
        <button class="btn btn-primary" id="download-btn">⬇️ Download TXT</button>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  trackToolUsage('text-cleaner');

  const textInput = document.getElementById('text-input');

  document.getElementById('btn-strip-spaces').addEventListener('click', () => {
    textInput.value = textInput.value.replace(/[ \t]+/g, ' ').replace(/^\s+|\s+$/gm, '');
    showToast("Extra spaces cleaned!", "success");
  });

  document.getElementById('btn-strip-html').addEventListener('click', () => {
    textInput.value = textInput.value.replace(/<[^>]*>?/gm, '');
    showToast("HTML tags stripped!", "success");
  });

  document.getElementById('btn-strip-breaks').addEventListener('click', () => {
    textInput.value = textInput.value.replace(/[\r\n]+/g, ' ');
    showToast("Line breaks removed!", "success");
  });

  document.getElementById('btn-find-replace').addEventListener('click', () => {
    const find = document.getElementById('find-str').value;
    const replace = document.getElementById('replace-str').value;
    if (!find) { showToast("Enter text to find", "warning"); return; }

    const regex = new RegExp(find.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
    textInput.value = textInput.value.replace(regex, replace);
    showToast("Find and replace completed!", "success");
  });

  document.getElementById('copy-btn').addEventListener('click', () => copyToClipboard(textInput.value));
  document.getElementById('clear-btn').addEventListener('click', () => { textInput.value = ''; });
  document.getElementById('download-btn').addEventListener('click', () => {
    if (!textInput.value) return;
    const blob = new Blob([textInput.value], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sanix-cleaned-text.txt';
    a.click();
  });
});
</script>
