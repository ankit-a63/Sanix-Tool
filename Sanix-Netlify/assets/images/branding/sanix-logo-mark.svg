<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7f00ff"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Glowing Hexagon Frame -->
  <polygon points="50,6 92,30 92,70 50,94 8,70 8,30" fill="none" stroke="url(#primary-grad)" stroke-width="4.5" filter="url(#neon-glow)" />
  
  <!-- Inner Cyber S Matrix -->
  <path d="M 62 30 L 38 30 C 30 30 30 43 38 43 L 62 57 C 70 57 70 70 62 70 L 38 70" fill="none" stroke="url(#accent-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)"/>
  
  <!-- Tech Accent Nodes -->
  <circle cx="50" cy="19" r="4" fill="#00f2fe" filter="url(#neon-glow)" />
  <circle cx="50" cy="81" r="4" fill="#7f00ff" filter="url(#neon-glow)" />
  <circle cx="31" cy="50" r="3" fill="#00f2fe" />
  <circle cx="69" cy="50" r="3" fill="#7f00ff" />
</svg>
