<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" id="sani-master-svg">
  <defs>
    <!-- Hair Gradient -->
    <linearGradient id="sani-hair-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Headset Neon Glow -->
    <linearGradient id="sani-neon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#7f00ff"/>
    </linearGradient>

    <!-- Eye Glow -->
    <radialGradient id="sani-eye-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>

    <!-- Suit Gradient -->
    <linearGradient id="sani-suit-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND HALO -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#sani-neon-grad)" stroke-width="2" opacity="0.4" filter="url(#glow-light)"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#00f2fe" stroke-dasharray="4 8" stroke-width="1.5" opacity="0.3"/>

  <!-- BACK HAIR -->
  <path d="M 50 80 Q 40 140 60 170 Q 100 185 140 170 Q 160 140 150 80 Z" fill="url(#sani-hair-grad)"/>

  <!-- NECK & SUIT -->
  <path d="M 85 130 L 115 130 L 122 155 L 78 155 Z" fill="#fbcfe8"/>
  <path d="M 60 155 Q 100 145 140 155 L 155 200 L 45 200 Z" fill="url(#sani-suit-grad)"/>
  <!-- Suit Collar Neon Trim -->
  <path d="M 70 155 Q 100 175 130 155" fill="none" stroke="url(#sani-neon-grad)" stroke-width="3" filter="url(#glow-light)"/>
  <!-- Sanix Chest Badge -->
  <polygon points="100,165 106,172 100,179 94,172" fill="#00f2fe" filter="url(#glow-light)"/>

  <!-- FACE BASE -->
  <path d="M 62 75 Q 100 60 138 75 Q 145 110 100 140 Q 55 110 62 75 Z" fill="#fff1f2"/>
  <!-- Cheeks Blush -->
  <ellipse cx="74" cy="108" rx="8" ry="4" fill="#fda4af" opacity="0.5"/>
  <ellipse cx="126" cy="108" rx="8" ry="4" fill="#fda4af" opacity="0.5"/>

  <!-- FRONT BANGS HAIR -->
  <path d="M 58 75 Q 80 50 100 70 Q 120 50 142 75 Q 125 60 100 80 Q 75 60 58 75 Z" fill="url(#sani-hair-grad)"/>

  <!-- CYBER CAT HEADSET (Left & Right Ears) -->
  <!-- Left Ear -->
  <polygon points="45,65 30,25 68,48" fill="#1e293b" stroke="url(#sani-neon-grad)" stroke-width="2"/>
  <polygon points="48,60 36,32 64,48" fill="#00f2fe" opacity="0.7" filter="url(#glow-light)"/>
  <!-- Right Ear -->
  <polygon points="155,65 170,25 132,48" fill="#1e293b" stroke="url(#sani-neon-grad)" stroke-width="2"/>
  <polygon points="152,60 164,32 136,48" fill="#00f2fe" opacity="0.7" filter="url(#glow-light)"/>
  <!-- Headset Band -->
  <path d="M 45 60 Q 100 30 155 60" fill="none" stroke="#334155" stroke-width="5"/>
  <path d="M 45 60 Q 100 30 155 60" fill="none" stroke="#00f2fe" stroke-width="2" filter="url(#glow-light)"/>

  <!-- EYEBROWS (Interactive via JS) -->
  <path id="sani-eyebrow-left" d="M 70 88 Q 80 84 90 88" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  <path id="sani-eyebrow-right" d="M 110 88 Q 120 84 130 88" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>

  <!-- EYES CONTAINER -->
  <g id="sani-eyes-group">
    <!-- Left Eye Socket -->
    <ellipse cx="80" cy="100" rx="12" ry="14" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Right Eye Socket -->
    <ellipse cx="120" cy="100" rx="12" ry="14" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Left Pupil (Trackable) -->
    <g id="sani-pupil-left">
      <ellipse cx="80" cy="100" rx="7" ry="9" fill="url(#sani-eye-grad)"/>
      <circle cx="78" cy="96" r="2.5" fill="#ffffff"/>
      <circle cx="82" cy="103" r="1.2" fill="#ffffff"/>
    </g>

    <!-- Right Pupil (Trackable) -->
    <g id="sani-pupil-right">
      <ellipse cx="120" cy="100" rx="7" ry="9" fill="url(#sani-eye-grad)"/>
      <circle cx="118" cy="96" r="2.5" fill="#ffffff"/>
      <circle cx="122" cy="103" r="1.2" fill="#ffffff"/>
    </g>
  </g>

  <!-- MOUTH (Interactive Path via JS) -->
  <path id="sani-mouth" d="M 94 122 Q 100 126 106 122" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round"/>

  <!-- NOSE -->
  <circle cx="100" cy="113" r="1" fill="#cbd5e1"/>
</svg>
